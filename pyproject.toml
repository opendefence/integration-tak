[project]
name = "odintegration_tak"
version = "0.1.0"
description = "OpenDefence TAK integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<4.0"
dependencies = [
    "cryptography>=46,<51",
]

[project.urls]
Repository = "https://github.com/opendefence/integration-tak"

[project.optional-dependencies]
# PyJNIus 1.8.0 has Android-only artifacts.
operator = ["cloudcoil[kubernetes,operator]", "pyjnius==1.7.0"]

[tool.uv.sources]
cloudcoil = { git = "https://github.com/cloudcoil/cloudcoil.git", tag = "0.8.0" }

[project.scripts]
odintegration-tak = "odintegration_tak.console:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0",
    "coverage>=7.16.0,<8.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.16.7,<1.0",
    "bandit>=1.9.4,<2.0",
    "pyrefly>=1.3.0,<2.0",
    "prek>=0.5.2,<1.0",
    "bump-my-version>=1.5.1,<2.0",
    "detect-secrets>=1.5.0,<2.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PL"]
ignore = ["PLR2004"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests", "docker"]
search-path = ["src", "."]
python-version = "3.14"

[tool.pytest.ini_options]
addopts = "--cov=odintegration_tak --cov-fail-under=90 --cov-branch"
junit_family = "xunit2"

[tool.coverage.run]
patch = ["subprocess"]
branch = true
omit = ["tests/*"]

[build-system]
requires = ["hatchling>=1.32.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odintegration_tak"]
