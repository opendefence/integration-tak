apiVersion: v1
kind: ServiceAccount
metadata:
  name: integration-tak-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: integration-tak-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: integration-tak-grants
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [tak-download-grants]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: integration-tak-grants
subjects:
  - kind: ServiceAccount
    name: integration-tak-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: integration-tak-grants
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: integration-tak-core-reader
rules:
  - apiGroups: [platform.opendefence.fi]
    resources: [users, groups, roles]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: integration-tak-core-reader
subjects:
  - kind: ServiceAccount
    name: integration-tak-operator
    namespace: integration-tak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: integration-tak-core-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: integration-tak-bindings
rules:
  - apiGroups: [platform.opendefence.fi]
    resources: [userbindings]
    verbs: [get, list, create, update]
  - apiGroups: [platform.opendefence.fi]
    resources: [userbindings/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: integration-tak-bindings
subjects:
  - kind: ServiceAccount
    name: integration-tak-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: integration-tak-bindings
