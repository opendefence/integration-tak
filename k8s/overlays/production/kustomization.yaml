apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: integration-tak
resources:
  - ../../integration
configMapGenerator:
  - name: integration-tak-settings
    behavior: merge
    literals:
      - public-origin=###ZARF_VAR_PUBLIC_ORIGIN###
patches:
  - target: {kind: Deployment, name: integration-tak-api}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "###ZARF_CONST_API_IMAGE###"
  - target: {kind: Deployment, name: integration-tak-operator}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "###ZARF_CONST_OPERATOR_IMAGE###"
