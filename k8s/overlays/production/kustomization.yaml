apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: integration-tak
resources:
  - ../../integration
configMapGenerator:
  - name: integration-tak-settings
    behavior: merge
    literals:
      - public-origin={{ .Values.publicOrigin }}
patches:
  - target: {kind: Deployment, name: integration-tak-api}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "{{ .Values.images.api }}"
  - target: {kind: Deployment, name: integration-tak-operator}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "{{ .Values.images.operator }}"
