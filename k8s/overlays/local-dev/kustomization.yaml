apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: integration-tak
resources:
  - ../production
patches:
  - target: {kind: Deployment, name: integration-tak-api}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target: {kind: Deployment, name: integration-tak-operator}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
