default_language_version:
  python: python3.14
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
      - id: check-ast
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: pyrefly
        name: Strict Pyrefly
        entry: uv run --locked pyrefly check
        language: system
        pass_filenames: false
        files: \.(py|pyi|toml)$
      - id: bandit
        name: Bandit
        entry: uv run --locked bandit -r src
        language: system
        pass_filenames: false
        types: [python]
      - id: detect-secrets
        name: Detect secrets
        entry: uv run --locked detect-secrets-hook
        language: system
        exclude: ^uv\.lock$
      - id: uv-lock
        name: Check uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
