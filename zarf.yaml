kind: ZarfPackageConfig
# shortcut: Images stay external; bundle pinned images for an offline release.
metadata:
  name: integration-tak
  description: OpenDefence TAK integration API and operator
variables:
  - name: PUBLIC_ORIGIN
    pattern: '^https://[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]{1,5})?$'
  - name: API_IMAGE
    pattern: '^[A-Za-z0-9._:/@-]+$'
  - name: OPERATOR_IMAGE
    pattern: '^[A-Za-z0-9._:/@-]+$'
components:
  - name: integration-local-dev
    required: true
    only: {flavor: local-dev}
    manifests:
      - name: integration-tak
        namespace: integration-tak
        template: true
        kustomizations:
          - k8s/overlays/local-dev
    actions:
      onDeploy:
        after:
          - description: Integration API to become available
            maxTotalSeconds: 300
            wait:
              cluster: {kind: deployment, name: integration-tak-api, namespace: integration-tak, condition: Available}
          - description: Integration operator to become available
            maxTotalSeconds: 300
            wait:
              cluster: {kind: deployment, name: integration-tak-operator, namespace: integration-tak, condition: Available}
  - name: integration-production
    required: true
    only: {flavor: production}
    manifests:
      - name: integration-tak
        namespace: integration-tak
        template: true
        kustomizations:
          - k8s/overlays/production
    actions:
      onDeploy:
        after:
          - description: Integration API to become available
            maxTotalSeconds: 300
            wait:
              cluster: {kind: deployment, name: integration-tak-api, namespace: integration-tak, condition: Available}
          - description: Integration operator to become available
            maxTotalSeconds: 300
            wait:
              cluster: {kind: deployment, name: integration-tak-operator, namespace: integration-tak, condition: Available}
